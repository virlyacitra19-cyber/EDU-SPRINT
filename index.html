<script>
"use strict";
/* ===== Teacher-editable config. Generator di menu mengisi ini; API: window.EDUSPRINT.setQuestions([...]) replaces the bank. =====
   Question format: {q:"text", options:[4 strings], answer:indexOfCorrect, explain:"feedback"} */
const CFG={length:720,questions:[
{q:"What is 7 x 8?",options:["54","56","64","48"],answer:1,explain:"7 x 8 = 56. Tip: 7 x 4 = 28, and doubling 28 gives 56."},
{q:"Which planet is called the Red Planet?",options:["Venus","Jupiter","Mars","Mercury"],answer:2,explain:"Mars looks red because its soil is rich in iron oxide, which is rust."},
{q:"Which gas do plants take in for photosynthesis?",options:["Oxygen","Carbon dioxide","Nitrogen","Helium"],answer:1,explain:"Plants absorb carbon dioxide and, with sunlight, make sugar and release oxygen."},
{q:"Which is the largest ocean on Earth?",options:["Atlantic","Indian","Arctic","Pacific"],answer:3,explain:"The Pacific Ocean covers about one third of Earth’s surface."},
{q:"How many sides does a hexagon have?",options:["5","6","7","8"],answer:1,explain:"Hex means six. A honeycomb cell is a hexagon."},
{q:"What is the capital city of Indonesia?",options:["Surabaya","Bandung","Jakarta","Medan"],answer:2,explain:"Jakarta is the capital and the largest city of Indonesia."}]};
window.EDUSPRINT={config:CFG,setQuestions:q=>{CFG.questions=q}};

const $=id=>document.getElementById(id),MAXL=1900,CP=[],L=[-2.4,0,2.4];let FIN=720;
const R=new THREE.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(R.domElement);
const S=new THREE.Scene();S.background=new THREE.Color(0x8fd3ff);S.fog=new THREE.Fog(0xcfeaff,80,250);
const cam=new THREE.PerspectiveCamera(62,1,.1,400);
function rs(){R.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
addEventListener('resize',rs);rs();
S.add(new THREE.HemisphereLight(0xffffff,0x6fa84a,.9));
const sun=new THREE.DirectionalLight(0xfff0d0,.95);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);
const sc2=sun.shadow.camera;sc2.left=sc2.bottom=-22;sc2.right=sc2.top=22;sc2.far=90;sc2.updateProjectionMatrix();S.add(sun,sun.target);
const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.7},o||{}));
function box(w,h,d,c,x,y,z){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.position.set(x,y,z);m.receiveShadow=true;S.add(m);return m}
function tex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t}

/* ===== Stadium ===== */
const TL=MAXL+160,ZC=-(MAXL+80)/2;
box(12,.2,TL,0xc9452f,0,-.1,ZC);box(160,.2,TL,0x56b04a,0,-.22,ZC);
[-6,-3.6,-1.2,1.2,3.6,6].forEach(x=>box(.12,.02,TL,0xffffff,x,.01,ZC));
for(const s of[-1,1])for(let t=0;t<5;t++){const h=1.4+t*1.4;box(2.6,h,TL,t%2?0x2f5fb8:0x3b73d6,s*(11+t*2.6),h/2,ZC)}
const banTex=tex(512,64,(c,w,h)=>{c.fillStyle="#ffd23f";c.fillRect(0,0,w,h);c.fillStyle="#14305a";c.font="900 40px Arial";c.textAlign="center";c.fillText("EDU SPRINT  *  RACE TO KNOWLEDGE",w/2,46)});
const banM=new THREE.MeshBasicMaterial({map:banTex}),banG=new THREE.PlaneGeometry(14,1.2);
for(const s of[-1,1])for(let z=10;z>-MAXL-100;z-=30){const b=new THREE.Mesh(banG,banM);b.position.set(s*9.68,.75,z);b.rotation.y=-s*Math.PI/2;S.add(b)}
const poleG=new THREE.CylinderGeometry(.06,.06,5,6),flagG=new THREE.BoxGeometry(.05,.9,1.5),poleM=M(0xeeeeee),fc=[0xff4d4d,0xffd23f,0x3bb273,0x3b8eea,0xff8cc6],fm=fc.map(c=>M(c));
let fi=0;for(let z=20;z>-MAXL-90;z-=20)for(const s of[-1,1]){const p=new THREE.Mesh(poleG,poleM);p.position.set(s*7,2.5,z);p.castShadow=true;S.add(p);
 const f=new THREE.Mesh(flagG,fm[fi++%5]);f.position.set(s*7,4.5,z-.75);S.add(f)}
for(let i=0;i<14;i++){const g=new THREE.Group();for(let j=0;j<4;j++){const m=new THREE.Mesh(new THREE.SphereGeometry(5+Math.random()*4,8,6),new THREE.MeshBasicMaterial({color:0xffffff,fog:false}));m.position.set(j*6-9,Math.random()*2,Math.random()*3);m.scale.y=.55;g.add(m)}
 g.position.set((Math.random()-.5)*220,55+Math.random()*25,-Math.random()*(MAXL+100));S.add(g)}
/* crowd */
const NC=4200,heads=new THREE.InstancedMesh(new THREE.SphereGeometry(.28,6,5),M(0xffffff,{roughness:.8}),NC),bods=new THREE.InstancedMesh(new THREE.BoxGeometry(.5,.6,.35),M(0xffffff,{roughness:.8}),NC);
heads.frustumCulled=bods.frustumCulled=false;
const skins=[0xf1c27d,0xe0ac69,0xc68642,0x8d5524,0xffdbac],shirts=[0xff4d4d,0xffd23f,0x3bb273,0x3b8eea,0xff8cc6,0xffffff,0x9b59b6],crowd=[],dm=new THREE.Object3D();
for(let i=0;i<NC;i++){const s=i%2?1:-1,t=(i>>1)%5,h=1.4+t*1.4;crowd.push([s*(11+t*2.6)+(Math.random()-.5)*1.9,h+.3,20-Math.random()*(MAXL+140),Math.random()*6]);
 heads.setColorAt(i,new THREE.Color(skins[i%5]));bods.setColorAt(i,new THREE.Color(shirts[(Math.random()*7)|0]))}
S.add(heads,bods);
function crowdUpd(t){for(let i=0;i<NC;i++){const c=crowd[i],b=Math.max(0,Math.sin(t*6+c[3]))*.28;dm.position.set(c[0],c[1]+b,c[2]);dm.updateMatrix();bods.setMatrixAt(i,dm.matrix);dm.position.y+=.55;dm.updateMatrix();heads.setMatrixAt(i,dm.matrix)}
 heads.instanceMatrix.needsUpdate=bods.instanceMatrix.needsUpdate=true}
crowdUpd(0);
/* gates */
function arch(z,txt,col,bg){const g=new THREE.Group(),pm=M(col);[-6.4,6.4].forEach(x=>{const p=new THREE.Mesh(new THREE.BoxGeometry(.7,6.4,.7),pm);p.position.set(x,3.2,0);p.castShadow=true;g.add(p)});
 const t=tex(512,96,(c,w,h)=>{c.fillStyle=bg;c.fillRect(0,0,w,h);c.fillStyle="#fff";c.font="900 62px Arial";c.textAlign="center";c.fillText(txt,w/2,70)}),bm=new THREE.MeshBasicMaterial({map:t});
 for(const d of[1,-1]){const b=new THREE.Mesh(new THREE.PlaneGeometry(13.5,1.9),bm);b.position.set(0,6.1,.3*d);b.rotation.y=d>0?0:Math.PI;g.add(b)}
 const bk=new THREE.Mesh(new THREE.BoxGeometry(13.8,2,.5),pm);bk.position.y=6.1;g.add(bk);g.position.z=z;S.add(g);return g}
const finArch=arch(-FIN,"FINISH",0x222222,"#222");
const chk=tex(256,64,(c,w,h)=>{for(let x=0;x<16;x++)for(let y=0;y<4;y++){c.fillStyle=(x+y)%2?"#111":"#fff";c.fillRect(x*16,y*16,16,16)}});
const fl=new THREE.Mesh(new THREE.PlaneGeometry(12,1.6),new THREE.MeshBasicMaterial({map:chk}));fl.rotation.x=-Math.PI/2;fl.position.set(0,.03,-FIN);S.add(fl);

/* ===== Cartoon kids ===== */
function kid(shirt,shorts,skin,hair,band){
 const root=new THREE.Group(),g=new THREE.Group(),inner=new THREE.Group();g.rotation.y=Math.PI;g.add(inner);root.add(g);
 const mk=(geo,c,x,y,z,p)=>{const m=new THREE.Mesh(geo,M(c,{roughness:.5}));m.position.set(x,y,z);m.castShadow=true;(p||inner).add(m);return m};
 mk(new THREE.CylinderGeometry(.3,.34,.62,14),shirt,0,1.12,0);mk(new THREE.CylinderGeometry(.34,.36,.26,14),shorts,0,.74,0);
 const legs=[-1,1].map(s=>{const p=new THREE.Group();p.position.set(s*.16,.65,0);inner.add(p);mk(new THREE.CylinderGeometry(.09,.08,.5,8),skin,0,-.25,0,p);
  mk(new THREE.SphereGeometry(.14,10,8),0xffffff,0,-.55,.06,p).scale.set(1,.6,1.5);mk(new THREE.CylinderGeometry(.1,.1,.12,8),0xffffff,0,-.38,0,p);return p});
 const arms=[-1,1].map(s=>{const p=new THREE.Group();p.position.set(s*.4,1.34,0);inner.add(p);mk(new THREE.CylinderGeometry(.075,.07,.48,8),skin,0,-.24,0,p);mk(new THREE.SphereGeometry(.09,8,8),skin,0,-.5,0,p);mk(new THREE.CylinderGeometry(.11,.1,.18,8),shirt,0,-.08,0,p);return p});
 const head=new THREE.Group();head.position.y=1.82;inner.add(head);
 mk(new THREE.SphereGeometry(.5,24,18),skin,0,0,0,head);
 mk(new THREE.SphereGeometry(.53,20,12,0,Math.PI*2,0,Math.PI*.38),hair,0,.03,-.05,head);
 mk(new THREE.SphereGeometry(.2,10,8),hair,0,.1,-.5,head);
 mk(new THREE.TorusGeometry(.48,.04,6,24),band,0,.2,0,head).rotation.x=Math.PI/2;
 for(const s of[-1,1]){mk(new THREE.SphereGeometry(.14,12,10),0xffffff,s*.19,.02,.39,head).scale.z=.6;mk(new THREE.SphereGeometry(.08,10,8),0x1b1b2f,s*.19,.02,.47,head);
  mk(new THREE.SphereGeometry(.03,6,6),0xffffff,s*.19+.03,.06,.54,head);mk(new THREE.SphereGeometry(.09,8,6),0xff8fa3,s*.3,-.14,.37,head).scale.set(1,.6,.5)}
 mk(new THREE.TorusGeometry(.1,.022,6,12,Math.PI),0x8a2b2b,0,-.12,.48,head).rotation.z=Math.PI;
 return{root,inner,legs,arms,head,ph:Math.random()*6}}
function anim(k,dt,sp,air,stum,t){
 if(sp>1.5){k.ph+=dt*sp*1.15;const s=Math.sin(k.ph);
  if(air){k.legs[0].rotation.x=-1.2;k.legs[1].rotation.x=.5;k.arms[0].rotation.x=-2.6;k.arms[1].rotation.x=-2.3;k.inner.position.y=0}
  else{k.legs[0].rotation.x=s*1.05;k.legs[1].rotation.x=-s*1.05;k.arms[0].rotation.x=-s*1.15;k.arms[1].rotation.x=s*1.15;k.inner.position.y=Math.abs(Math.cos(k.ph))*.1}
  k.inner.rotation.x=.16+(stum?-.25:0);k.inner.rotation.z=stum?Math.sin(t*40)*.15:0;k.head.rotation.z=s*.05}
 else{k.legs[0].rotation.x=k.legs[1].rotation.x=0;k.arms[0].rotation.x=k.arms[1].rotation.x=0;k.inner.rotation.x=.05;k.inner.rotation.z=0;k.inner.position.y=Math.sin(t*2+k.ph)*.015;k.head.rotation.z=Math.sin(t+k.ph)*.04}}
const pk=kid(0xff7a1a,0x2b5fd9,0xf1c27d,0x4a2a14,0xffffff);S.add(pk.root);
const bub=new THREE.Mesh(new THREE.SphereGeometry(1.35,20,14),new THREE.MeshStandardMaterial({color:0x58b8ff,transparent:true,opacity:.28,emissive:0x1a6fd0,emissiveIntensity:.5}));bub.position.y=1.1;pk.root.add(bub);
const opps=[{k:kid(0x2fbf6a,0x7a3fd1,0xc68642,0x111111,0xffd23f),x:-4.8,skill:.93},{k:kid(0x3b8eea,0xffd23f,0xffdbac,0xb5651d,0xff4d4d),x:4.8,skill:.97}];
opps.forEach(o=>{S.add(o.k.root);o.d=0;o.v=0});

/* ===== Items ===== */
const items=[],coinG=new THREE.CylinderGeometry(.38,.38,.09,18),coinM=M(0xffc21a,{metalness:.6,roughness:.3,emissive:0x664400});coinG.rotateX(Math.PI/2);
const wM=M(0xffffff),rM=M(0xe5483b),orM=M(0xff8a1f),shG=new THREE.SphereGeometry(.4,14,10),enG=new THREE.OctahedronGeometry(.45);
function mkItem(type){let m,h=0;
 if(type==='coin')m=new THREE.Mesh(coinG,coinM);
 else if(type==='shield')m=new THREE.Mesh(shG,M(0x58b8ff,{emissive:0x1a6fd0,emissiveIntensity:.8}));
 else if(type==='energy')m=new THREE.Mesh(enG,M(0x4cf08a,{emissive:0x12a84a,emissiveIntensity:.8}));
 else if(type==='hurdle'){m=new THREE.Group();h=.8;[-.9,.9].forEach(x=>{const p=new THREE.Mesh(new THREE.BoxGeometry(.1,.85,.1),wM);p.position.set(x,.42,0);m.add(p)});
  [.7,.45].forEach((y,i)=>{const b=new THREE.Mesh(new THREE.BoxGeometry(1.9,.16,.1),i?wM:rM);b.position.y=y;m.add(b)})}
 else{m=new THREE.Group();h=.7;const c=new THREE.Mesh(new THREE.ConeGeometry(.42,.95,14),orM);c.position.y=.48;m.add(c);const b=new THREE.Mesh(new THREE.CylinderGeometry(.3,.3,.1,10),wM);b.position.y=.5;m.add(b)}
 m.traverse(o=>{if(o.isMesh)o.castShadow=true});return{m,h}}
function add(type,lane,d){const o=mkItem(type);o.m.position.set(L[lane],type==='coin'?1.1:type==='shield'||type==='energy'?1.2:0,-d);S.add(o.m);items.push({m:o.m,h:o.h,type,lane,d,on:true})}
function build(){items.forEach(i=>S.remove(i.m));items.length=0;
 for(let d=45;d<FIN-25;d+=11+Math.random()*9){if(CP.some(c=>Math.abs(c-d)<14))continue;
  const ln=[0,1,2].sort(()=>Math.random()-.5),n=Math.random()<.3?2:1;
  for(let i=0;i<n;i++)add(Math.random()<.55?'hurdle':'cone',ln[i],d);
  const r=Math.random(),fl=ln[n];
  if(r<.72)for(let k=-2;k<=2;k++)add('coin',fl,d+k*1.7);else if(r<.82)add('shield',fl,d);else if(r<.92)add('energy',fl,d)}}

/* ===== Game state ===== */
let st='menu',dist=0,lane=1,px=0,py=0,vy=0,score=0,coins=0,combo=0,mult=1,shield=false,energy=100,boost=0,inv=0,stum=0,speed=0,time=0,cpIdx=0,correct=0,cd=-1,fdelay=0,rank=1,fin={},gt=0,cf=0,tSpr=false,pname="Pelari",qs=[],cur=null,shown=false,tt;
const keys={};
function toast(t){const m=$('msg');m.textContent=t;m.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>m.style.opacity=0,1000)}
const bar=$('bar');
const dots=['#ff7a1a','#2fbf6a','#3b8eea'].map(c=>{const d=document.createElement('i');d.className='dot';d.style.background=c;bar.appendChild(d);return d});

let setup={mapel:"",jenjang:"",topik:"",tujuan:"",n:10,mat:"",code:""},gates=[];
try{Object.assign(setup,JSON.parse(localStorage.getItem('edusprintSetup'))||{})}catch(e){}
if(typeof setup.jenjang!=='string')setup.jenjang="";setup.n=Math.max(10,Math.min(30,+setup.n||10));
const JEN=["SD Kelas 1","SD Kelas 2","SD Kelas 3","SD Kelas 4","SD Kelas 5","SD Kelas 6","SMP Kelas 7","SMP Kelas 8","SMP Kelas 9","SMA Kelas 10","SMA Kelas 11","SMA Kelas 12","SMK Kelas 10","Perguruan Tinggi"];

function openQuiz(){st='quiz';cur=qs[cpIdx%qs.length];cur.done=false;const ov=$('ov');ov.style.display='flex';
 ov.innerHTML='<div class="card"><h2>Gerbang kuis '+(cpIdx+1)+' dari '+CP.length+'</h2><div class="small">'+esc(setup.mapel)+' - '+esc(setup.topik)+'</div><div class="q">'+esc(cur.q)+'</div><div class="opts">'+cur.options.map((o,i)=>'<button class="opt" data-i="'+i+'">'+"ABCD"[i]+". "+esc(o)+'</button>').join('')+'</div><div id="fb"></div></div>';
 ov.querySelectorAll('.opt').forEach(b=>b.onclick=()=>answer(+b.dataset.i))}
function answer(i){if(!cur||cur.done)return;cur.done=true;const bs=document.querySelectorAll('.opt'),ok=i===cur.answer;
 bs[cur.answer].classList.add('ok');if(!ok)bs[i].classList.add('bad');
 if(ok){correct++;score+=150;boost=4;toast("Turbo kecepatan!")}
 $('fb').innerHTML=(ok?'<span style="color:var(--ok)">Benar! +150 poin dan turbo kecepatan.</span>':'<span style="color:var(--bad)">Belum tepat. Jawaban yang benar: "'+esc(cur.options[cur.answer])+'".</span>')+'<br>'+esc(cur.explain)+'<br><button class="btn" id="ct">Lanjut berlari</button>';
 $('ct').onclick=()=>{cur=null;$('ov').style.display='none';cpIdx++;inv=1;st='run'}}
function finish(){st='finish';fdelay=1.8;rank=1+opps.filter(o=>o.d>=FIN).length;
 fin={tb:Math.max(0,Math.round((FIN/9-time)*8)),pb:[600,300,100][rank-1]};score+=fin.tb+fin.pb}
function showFinish(){shown=true;
 $('ov').style.display='flex';$('ov').innerHTML='<div class="card"><h1>Permainan Selesai!</h1><p class="small">'+esc(setup.mapel)+' - '+esc(setup.topik)+'</p><h2>SKOR AKHIR</h2><div style="font-size:clamp(42px,10vw,68px);font-weight:900;color:var(--acc);margin:12px 0">'+score.toLocaleString('id-ID')+'</div><p>Hebat! Terus tingkatkan hasil belajarmu.</p><button class="btn" id="ra">Main Lagi</button> <button class="btn" id="mn" style="background:#3b73d6;box-shadow:0 4px 0 #1f4a99">Kembali ke Menu</button></div>';
 $('ra').onclick=()=>begin(true);$('mn').onclick=()=>{reset();menu()}}
function togglePause(){if(st==='run'){st='pause';$('ov').style.display='flex';$('ov').innerHTML='<div class="card"><h1>Jeda</h1><button class="btn" id="rs">Lanjutkan</button></div>';$('rs').onclick=togglePause}
 else if(st==='pause'){st='run';$('ov').style.display='none'}}
function move(d){if(st==='run')lane=Math.max(0,Math.min(2,lane+d))}
function jump(){if(st==='run'&&py===0&&vy===0)vy=10.5}

/* ===== Input ===== */
addEventListener('keydown',e=>{if(e.target.closest&&e.target.closest('input,textarea,select'))return;const c=e.code;keys[c]=true;
 if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(c))e.preventDefault();
 if(c==='ArrowLeft'||c==='KeyA')move(-1);else if(c==='ArrowRight'||c==='KeyD')move(1);
 else if((c==='Space'||c==='ArrowUp'||c==='KeyW')&&!e.repeat)jump();else if(c==='KeyP')togglePause();
 else if(st==='quiz'&&/^(Digit|Numpad)[1-4]$/.test(c))answer(+c.slice(-1)-1)});
addEventListener('keyup',e=>keys[e.code]=false);addEventListener('blur',()=>{for(const k in keys)keys[k]=false;tSpr=false});
function hold(id,dn,up){const b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();dn()});['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,()=>up&&up()))}
hold('bL',()=>move(-1));hold('bR',()=>move(1));hold('bJ',jump);hold('bS',()=>tSpr=true,()=>tSpr=false);
$('pb').onclick=togglePause;
if(matchMedia('(pointer:coarse)').matches||'ontouchstart' in window)document.body.classList.add('touch');
addEventListener('touchstart',()=>document.body.classList.add('touch'),{passive:true,once:true});
let sx=0,sy=0;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
addEventListener('touchend',e=>{if(st!=='run'||!e.changedTouches[0]||e.target.closest('.tb,button'))return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
 if(Math.abs(dx)>40&&Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else if(dy<-40)jump()},{passive:true});

/* ===== Update loop ===== */
function update(dt){
 gt+=dt;if(++cf%3===0)crowdUpd(gt);
 if(st==='pause'||st==='quiz')return;
 const go=st==='run'||st==='finish',base=14+6*Math.min(1,dist/FIN);
 if(cd>-.7){cd-=dt;const n=Math.ceil(cd-.4);$('cnt').textContent=n>0?n:'MULAI!';$('cnt').style.opacity=cd>-.5?1:0;if(st==='count'&&cd<=.4)st='run'}
 if(go){let sp=base;const spr=st==='run'&&(keys.ShiftLeft||keys.ShiftRight||tSpr)&&energy>0;
  if(spr){sp*=1.3;energy=Math.max(0,energy-24*dt)}else energy=Math.min(100,energy+9*dt);
  if(boost>0){sp*=1.35;boost-=dt}if(stum>0){sp*=.5;stum-=dt}if(inv>0)inv-=dt;
  if(st==='finish')sp=Math.max(0,(FIN+20-dist)*.9);
  speed+=(sp-speed)*Math.min(1,dt*(st==='finish'?2:4));dist+=speed*dt;if(st==='run')time+=dt;
  px+=(L[lane]-px)*Math.min(1,dt*13);
  if(py>0||vy>0){vy-=30*dt;py+=vy*dt;if(py<=0){py=0;vy=0}}
  for(const it of items){if(!it.on)continue;
   if(it.type==='coin')it.m.rotation.y+=dt*4;else if(it.type==='shield'||it.type==='energy'){it.m.rotation.y+=dt*2;it.m.position.y=1.2+Math.sin(gt*3)*.15}
   if(st!=='run'||Math.abs(it.d-dist)>.8||Math.abs(it.m.position.x-px)>1.1)continue;
   if(it.type==='coin'){coins++;combo++;mult=1+Math.min(4,Math.floor(combo/5));score+=10*mult;if(combo%5===0)toast("Kombo x"+mult+"!")}
   else if(it.type==='shield'){shield=true;score+=25;toast("Perisai aktif!")}
   else if(it.type==='energy'){energy=100;boost=2.5;score+=25;toast("Energi penuh!")}
   else{if(inv>0||py>=it.h-.05)continue;
    if(shield){shield=false;inv=1;toast("Perisai menyelamatkanmu!")}else{stum=1;inv=1.4;combo=0;mult=1;score=Math.max(0,score-20);toast("Aduh! Tersandung")}}
   it.on=false;it.m.visible=false}
  if(st==='run'){if(cpIdx<CP.length&&dist>=CP[cpIdx]-2)openQuiz();else if(dist>=FIN)finish()}
  if(st==='finish'){fdelay-=dt;if(fdelay<=0&&!shown)showFinish()}}
 opps.forEach((o,i)=>{if(go){let tg=base*(o.skill+.04*Math.sin(time*.7+i*2))+(dist-o.d)*.03;if(o.d>FIN)tg=Math.max(0,(FIN+20-o.d)*.9);
  o.v+=(tg-o.v)*Math.min(1,dt*2);o.d+=o.v*dt}
  o.k.root.position.set(o.x,0,-o.d);anim(o.k,dt,o.v,false,false,gt)});
 pk.root.position.set(px,py,-dist);pk.root.rotation.y=(px-L[lane])*.1;pk.root.visible=!(inv>0&&Math.floor(gt*14)%2);bub.visible=shield;
 anim(pk,dt,go?speed:0,py>.05,stum>0,gt);
 const tx=px*.55,tz=-dist+(st==='menu'?-5.5:7.2),ty=st==='menu'?2:3.4+py*.3,lk=Math.min(1,dt*(go?7:3));
 if(st==='menu'){cam.position.set(2.6,2,-5.5);cam.lookAt(0,1.2,0)}
 else{cam.position.x+=(tx-cam.position.x)*lk;cam.position.y+=(ty-cam.position.y)*lk;cam.position.z=go?tz:cam.position.z+(tz-cam.position.z)*lk;
  cam.lookAt(px*.7,1.5,-dist-9);const fv=62+Math.max(0,speed-14)*.9+(boost>0?6:0);cam.fov+=(fv-cam.fov)*Math.min(1,dt*3);cam.updateProjectionMatrix()}
 sun.position.set(px+16,32,-dist+12);sun.target.position.set(px,0,-dist-5);
 /* HUD */
 const rk=1+opps.filter(o=>o.d>dist).length;
 $('sc').textContent=score;$('cn').textContent=coins;$('en').style.width=energy+'%';$('sh').style.opacity=shield?1:.35;$('cb').textContent=combo>=5?"KOMBO x"+mult:"";
 $('rk').textContent="Posisi "+(st==='finish'?rank:rk)+" / 3";$('dst').textContent=Math.min(FIN,Math.floor(dist))+" / "+FIN+" m";
 dots[0].style.left=Math.min(100,dist/FIN*100)+'%';dots[1].style.left=Math.min(100,opps[0].d/FIN*100)+'%';dots[2].style.left=Math.min(100,opps[1].d/FIN*100)+'%'}
let last=performance.now();
function loop(n){requestAnimationFrame(loop);const dt=Math.min(.05,(n-last)/1000);last=n;update(dt);R.render(S,cam)}
setCP(10);reset();menu();requestAnimationFrame(loop);
</script></body></html>
